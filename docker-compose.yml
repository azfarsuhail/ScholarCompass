# Local dev. Production runs the same api image against Neon.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: scholarcompass
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  api:
    build: ./api
    # Mirror the production ceiling locally, so an OOM shows up on a laptop
    # rather than in prod.
    mem_limit: 512m
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/scholarcompass
      SESSION_SECRET: dev-only-not-for-production-use-32b
      COOKIE_SECURE: "false" # plain HTTP locally
      CORS_ORIGINS: http://localhost:3000
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ORIZN_API_KEY: ${ORIZN_API_KEY:-}
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
